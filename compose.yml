services:
  activio-club-concept:
    image: node:24-alpine
    container_name: activio-club-concept
    restart: unless-stopped
    user: "1000:1000"
    working_dir: /app
    command:
      - node
      - server.mjs
    env_file:
      - .env
    environment:
      ACTIVIO_DEMO_HOST: 0.0.0.0
      ACTIVIO_DEMO_PORT: 8080
      ACTIVIO_TRUST_PROXY: "true"
    volumes:
      - .:/app:ro
    ports:
      - "127.0.0.1:18080:8080"
    networks:
      - traefik_proxy
    labels:
      traefik.enable: "true"
      traefik.docker.network: traefik_proxy
      traefik.http.routers.activio-club-concept.priority: "10000"
      traefik.http.routers.activio-club-concept.rule: Host(`bkt44bartek.tailf5aee2.ts.net`)
      traefik.http.services.activio-club-concept.loadbalancer.server.port: "8080"

networks:
  traefik_proxy:
    external: true
